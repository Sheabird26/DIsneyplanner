    :root {
      --disney-navy:  #0a1f5c;
      --disney-blue:  #1757a6;
      --disney-gold:  #c9a040;
      --disney-gold2: #e8c76a;
      --disney-dark:  #06122e;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; background: #f4f5f7; margin: 0; }

    /* ── Banner ── */
    .disney-banner {
      position: relative;
      width: 100%;
      height: 360px;
      overflow: hidden;
      background: #06122e;
    }
    .disney-banner-slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transition: opacity 0.7s ease;
    }
    .disney-banner-slide img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
    }
    .slide-dots {
      display: flex; justify-content: center; gap: 8px; margin-top: 14px;
    }
    .slide-dot {
      height: 8px; border-radius: 4px;
      border: none; cursor: pointer; padding: 0;
      transition: all 0.35s ease;
      background: rgba(255,255,255,0.38);
    }
    .slide-dot.active { background: var(--disney-gold); width: 24px !important; }
    .disney-banner-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(6,18,46,0.25) 0%,
        rgba(6,18,46,0.15) 40%,
        rgba(6,18,46,0.70) 80%,
        rgba(6,18,46,0.92) 100%
      );
    }
    .disney-banner-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      text-align: center;
      padding: 0 1rem 1.75rem;
    }
    .disney-title {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.7);
      line-height: 1.15;
    }
    .disney-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--disney-gold2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.35rem;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }
    .disney-stars {
      color: var(--disney-gold);
      font-size: 1rem;
      letter-spacing: 0.3em;
      margin-bottom: 0.4rem;
    }
    .guest-chip {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      border-radius: 999px;
      padding: 3px 10px;
      backdrop-filter: blur(4px);
    }

    /* ── Tab nav ── */
    .disney-nav {
      background: var(--disney-navy);
      position: sticky; top: 0; z-index: 20;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .disney-nav-inner { max-width: 72rem; margin: 0 auto; display: flex; overflow-x: auto; }
    .disney-tab {
      flex: none; padding: 0 1.25rem; height: 52px;
      display: flex; align-items: center; gap: 7px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: 13px;
      color: rgba(255,255,255,0.6);
      border-bottom: 3px solid transparent;
      white-space: nowrap; transition: all 0.18s;
      cursor: pointer; background: none; border-top: none; border-left: none; border-right: none;
    }
    .disney-tab:hover { color: var(--disney-gold2); }
    .disney-tab.active {
      color: var(--disney-gold);
      border-bottom-color: var(--disney-gold);
    }

    /* ── Cards & accents ── */
    .disney-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); border: 1px solid #e8eaf0; }
    .section-label { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #8a93a8; }
    .gold-btn { background: var(--disney-gold); color: #06122e; font-weight: 800; border-radius: 10px; padding: 8px 18px; font-size: 13px; transition: background 0.15s; border: none; cursor: pointer; }
    .gold-btn:hover { background: var(--disney-gold2); }

    /* ── Drags ── */
    .drag-over-park { border: 2px dashed #1757a6 !important; background: #eef4ff !important; }
    .drag-over-food { border: 2px dashed #c9a040 !important; background: #fdf8ec !important; }
    .draggable { cursor: grab; user-select: none; }
    .draggable:active { cursor: grabbing; opacity: 0.5; }

    /* ── Misc ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #c5cad8; border-radius: 4px; }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    input:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(23,87,166,0.18); }
    .park-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; font-weight: 800; font-size: 12px; padding: 4px 11px; }
    .food-chip { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; font-weight: 700; font-size: 11px; padding: 3px 8px; cursor: grab; user-select: none; }
    .food-chip:active { cursor: grabbing; opacity: 0.5; }
    .progress-bar { transition: width 0.4s ease; }
  </style>
</head>

  ATTENDEES.forEach(a => {

    Object.keys(RIDES).forEach(pk => {
      RIDES[pk].rides.forEach(r => { w[a.id][`${pk}::${r.name}`] = false; });
    });
  });
  return w;
};

// Fallback gradient themes (used when no images are loaded)
const BANNER_THEMES = [
  { gradient: 'linear-gradient(145deg,#06122e 0%,#0a2a6e 45%,#1a5cb8 80%,#5aaee8 100%)', label: 'Magic Kingdom' },
  { gradient: 'linear-gradient(145deg,#0a1a06 0%,#0a3d1a 40%,#1a6b35 75%,#4db87a 100%)', label: 'Animal Kingdom' },
  { gradient: 'linear-gradient(145deg,#1a0622 0%,#3a0f5c 40%,#6b22a8 75%,#ae60e8 100%)', label: 'Hollywood Studios' },
  { gradient: 'linear-gradient(145deg,#041828 0%,#083d6e 40%,#1270b0 75%,#48aee0 100%)', label: 'EPCOT' },
  { gradient: 'linear-gradient(145deg,#1a0e04 0%,#4a2c0a 40%,#8b5a1a 75%,#c9902a 100%)', label: 'Animal Kingdom Lodge' },
  { gradient: 'linear-gradient(145deg,#06122e 0%,#12064e 40%,#2e1280 72%,#7048c0 100%)', label: 'Nighttime Magic' },
  { gradient: 'linear-gradient(145deg,#041e10 0%,#0a4228 40%,#1a7850 75%,#40b888 100%)', label: 'Disney Springs' },
  { gradient: 'linear-gradient(145deg,#04141e 0%,#082840 40%,#124868 75%,#38809a 100%)', label: 'Typhoon Lagoon' },
];

const Header = () => {
  const imgs = BANNER_IMAGES.filter(Boolean);
  const hasImgs = imgs.length > 0;
  const count = hasImgs ? imgs.length : BANNER_THEMES.length;
  const [idx, setIdx] = React.useState(0);
  const [visible, setVisible] = React.useState(true);

  const goTo = (i) => {
    setVisible(false);
    setTimeout(() => { setIdx(i); setVisible(true); }, 400);
  };

  React.useEffect(() => {
    if (count <= 1) return;
    const t = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setIdx(i => (i + 1) % count); setVisible(true); }, 400);
    }, 5500);
    return () => clearInterval(t);
  }, [count]);

  return (
    <div className="disney-banner">
      {/* Slide layer */}
      <div className="disney-banner-slide" style={{ opacity: visible ? 1 : 0 }}>
        {hasImgs
          ? <img src={imgs[idx]} alt="Disney World" />
          : <div style={{ position:'absolute', inset:0, background: BANNER_THEMES[idx].gradient }} />
        }
      </div>
      {/* Overlay + text */}
      <div className="disney-banner-overlay" />
      <div className="disney-banner-content">
        <div className="disney-stars">✦ ✦ ✦</div>
        <h1 className="disney-title">Shea Family · Disney World 2026</h1>
        <p className="disney-subtitle">Animal Kingdom Lodge · Kidani Village · Aug 21 – 29</p>
        {count > 1 && (
          <div className="slide-dots">
            {Array.from({length: count}).map((_, i) => (
              <button key={i} onClick={() => goTo(i)}
                className={`slide-dot${i===idx?' active':''}`}
                style={{ width: i===idx ? 24 : 8 }}
              />
            ))}
          </div>
        )}
      </div>

const DayCard = ({ date, ticket, parkAssign, setParkAssign, dayMeals, setDayMeals, dragItem, setDragItem, dayReservations }) => {
  const meta = DATE_META[date];
  const [overSlot, setOverSlot] = useState(null);

  const handleDrop = (slot) => {
    if (!dragItem) return;
    if (dragItem.type === 'park' && (slot === 'park1' || slot === 'park2')) {
      setParkAssign(prev => ({ ...prev, [`${date}-${slot}`]: dragItem.data.id }));
    }
    if (dragItem.type === 'food' && ['breakfast','lunch','dinner'].includes(slot)) {
      setDayMeals(prev => ({ ...prev, [date]: { ...prev[date], [slot]: dragItem.data.name } }));
    }
    setDragItem(null); setOverSlot(null);
  };

  const removePark = (slot) => setParkAssign(prev => { const n={...prev}; delete n[`${date}-${slot}`]; return n; });
  const updateMeal = (meal, val) => setDayMeals(prev => ({ ...prev, [date]: { ...prev[date], [meal]: val } }));

  const isArrival   = meta.style === 'arrival';
  const isDeparture = meta.style === 'departure';
  const headerBg = isArrival ? 'linear-gradient(90deg,#1d4ed8,#7c3aed)' : isDeparture ? 'linear-gradient(90deg,#db2777,#9333ea)' : 'none';

  const renderParkSlot = (slot, placeholder) => {
    const pId = parkAssign[`${date}-${slot}`];
    const park = PARKS.find(p => p.id === pId);
    const isResort = pId === 'resort';
    const isOver = overSlot === slot;
    return (
      <div
        className={`min-h-10 rounded-xl border-2 border-dashed transition-all duration-150 flex items-center ${isOver ? 'drag-over-park' : 'border-gray-200'}`}
        onDragOver={e => { e.preventDefault(); setOverSlot(slot); }}
        onDragLeave={() => setOverSlot(null)}
        onDrop={() => handleDrop(slot)}
      >
        {pId ? (
          <div className="w-full flex items-center justify-between px-2 py-1">
            <span className="park-chip text-xs" style={isResort ? { backgroundColor: '#f1f5f9', color: '#475569', border: '1.5px solid #cbd5e1' } : { backgroundColor: park?.bg, color: park?.color, border: `1.5px solid ${park?.border}` }}>
              {isResort ? '🏊 Resort Day' : `${park?.emoji} ${park?.name}`}
            </span>
            <button onClick={() => removePark(slot)} className="text-gray-300 hover:text-red-400 text-xl font-bold ml-1 leading-none">×</button>
          </div>
        ) : (
          <span className="text-gray-300 text-xs px-3">{placeholder}</span>
        )}
      </div>
    );
  };

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div className="px-4 py-2.5 flex items-center gap-3" style={{ background: headerBg || '#f8fafc', borderBottom: '1px solid #f1f5f9' }}>
        <span className={`font-black text-lg ${isArrival||isDeparture?'text-white':'text-gray-800'}`}>{meta.short}</span>
        {meta.tag && <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${isArrival||isDeparture?'bg-white bg-opacity-25 text-white':'bg-gray-100 text-gray-500'}`}>{meta.tag}</span>}
      </div>
      <div className="p-4 grid md:grid-cols-5 gap-4">
        {/* Parks */}
        <div className="md:col-span-2 space-y-2">
          <div className="text-xs font-black text-gray-400 uppercase tracking-widest">Parks</div>
          {renderParkSlot('park1', 'Drop Park Here')}
          {ticket.hopper && renderParkSlot('park2', '+ Hop to 2nd Park')}
        </div>
        {/* Meals */}
        <div className="md:col-span-3 grid grid-cols-3 gap-2">
          {['breakfast','lunch','dinner'].map(meal => {
            const icons = { breakfast: '☀️', lunch: '🌤️', dinner: '🌙' };
            const isOver = overSlot === meal;
            return (
              <div key={meal}>
                <div className="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">{icons[meal]} {meal}</div>
                <div
                  className={`rounded-xl transition-all ${isOver ? 'drag-over-food ring-2 ring-amber-300' : ''}`}
                  onDragOver={e => { e.preventDefault(); setOverSlot(meal); }}
                  onDragLeave={() => setOverSlot(null)}
                  onDrop={() => handleDrop(meal)}
                >
                  <input type="text" value={dayMeals[meal]||''} onChange={e=>updateMeal(meal,e.target.value)} placeholder="Drop or type…" className="w-full border border-gray-200 rounded-xl px-2 py-2 text-xs" />
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="px-4 pb-4">
        <input type="text" value={dayMeals.notes||''} onChange={e=>updateMeal('notes',e.target.value)} placeholder="📝 Day notes (Lightning Lane, plans…)" className="w-full border border-dashed border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-500" />
      </div>
      {dayReservations && dayReservations.length > 0 && (
        <div className="px-4 pb-4 border-t border-dashed border-amber-100 pt-3">
          <div className="text-xs font-black text-gray-400 uppercase tracking-widest mb-2">🍽️ Dining Reservations</div>
          <div className="flex flex-col gap-1.5">
            {dayReservations.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(r => {
              const sc = { confirmed:'#16a34a', pending:'#d97706', waitlist:'#7c3aed', cancelled:'#dc2626' }[r.status] || '#6b7280';
              const party = r.partyIds.length === ATTENDEES.length ? 'Entire Group' : r.partyIds.length <= 5 ? r.partyIds.map(id=>ATTENDEES.find(a=>a.id===id)?.name).filter(Boolean).join(', ') : `${r.partyIds.length} guests`;
              return (
                <div key={r.id} className="flex items-center gap-2 text-xs px-2.5 py-1.5 rounded-lg"
                  style={{ background: `${sc}10`, border: `1px solid ${sc}35` }}>
                  <span style={{ color: sc }}>●</span>
                  <span className="font-black text-gray-700">{r.time && `${r.time} · `}{r.restaurant}</span>
                  <span className="text-gray-400 ml-1">· {party}</span>
                  {r.confirmation && <span className="ml-auto text-gray-300 font-mono text-xs">#{r.confirmation}</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

const WishlistTab = ({ wishlist, setWishlist }) => {
  const [view, setView]       = useState('person');
  const [person, setPerson]   = useState(ATTENDEES[0].id);
  const [parkFilter, setParkFilter] = useState(null);

  const toggle = (pid, key) => setWishlist(prev => ({ ...prev, [pid]: { ...prev[pid], [key]: !prev[pid][key] } }));
  const countFor = pid => Object.values(wishlist[pid]||{}).filter(Boolean).length;
  const wanters = (parkId, rideName) => {
    const key = `${parkId}::${rideName}`;
    return ATTENDEES.filter(a => wishlist[a.id]?.[key]).map(a => a.name);
  };

  const activePerson = ATTENDEES.find(a => a.id === person);

  // Group rides by area within each park
  const getAreas = (parkId) => {
    const rides = RIDES[parkId].rides;
    const areas = {};
    rides.forEach(r => {
      if (!areas[r.area]) areas[r.area] = [];
      areas[r.area].push(r);
    });
    return areas;
  };

  // Build height guide data
  const heightGuide = () => {
    const buckets = {};
    Object.entries(RIDES).forEach(([parkId, { park, rides }]) => {
      rides.forEach(r => {
        const key = r.height ? `${r.height}"` : 'No Requirement';
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push({ ...r, park, parkId });
      });
    });
    // Sort: no requirement first, then ascending height
    return Object.entries(buckets).sort(([a],[b]) => {
      if (a === 'No Requirement') return -1;
      if (b === 'No Requirement') return 1;
      return parseInt(a) - parseInt(b);
    });
  };

  const heightColor = (key) => {
    if (key === 'No Requirement') return { bg: '#f0fdf4', border: '#bbf7d0', text: '#15803d', badge: '#dcfce7' };
    const h = parseInt(key);
    if (h <= 35) return { bg: '#fefce8', border: '#fde68a', text: '#92400e', badge: '#fef9c3' };
    if (h <= 40) return { bg: '#fff7ed', border: '#fed7aa', text: '#9a3412', badge: '#ffedd5' };
    return { bg: '#fef2f2', border: '#fecaca', text: '#b91c1c', badge: '#fee2e2' };
  };

  return (
    <div className="space-y-5 fade-in">
      <div className="flex flex-wrap gap-2">
        <button onClick={() => setView('person')} className={`px-4 py-2 rounded-full text-sm font-black transition-all ${view==='person'?'bg-violet-600 text-white shadow-md':'bg-white text-gray-500 border border-gray-200 hover:border-violet-300'}`}>👤 By Person</button>
        <button onClick={() => setView('ride')}   className={`px-4 py-2 rounded-full text-sm font-black transition-all ${view==='ride'  ?'bg-violet-600 text-white shadow-md':'bg-white text-gray-500 border border-gray-200 hover:border-violet-300'}`}>🎢 Group Popularity</button>
        <button onClick={() => setView('height')} className={`px-4 py-2 rounded-full text-sm font-black transition-all ${view==='height'?'bg-violet-600 text-white shadow-md':'bg-white text-gray-500 border border-gray-200 hover:border-violet-300'}`}>📏 Height Guide</button>
      </div>

      {view === 'person' && (
        <div className="grid md:grid-cols-4 gap-5">
          {/* Person picker */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-3">
            <div className="text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Select Person</div>
            <div className="space-y-0.5">
              {ATTENDEES.map(a => {
                const cnt = countFor(a.id);
                return (
                  <button key={a.id} onClick={() => setPerson(a.id)} className={`w-full text-left flex items-center justify-between px-3 py-2 rounded-xl transition-all text-sm font-semibold ${person===a.id?'bg-violet-100 text-violet-700':'hover:bg-gray-50 text-gray-600'}`}>
                    <span>{a.emoji} {a.name}</span>
                    {cnt > 0 && <span className="text-xs bg-violet-500 text-white w-5 h-5 flex items-center justify-center rounded-full font-black">{cnt}</span>}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Ride picker */}
          <div className="md:col-span-3 space-y-3">
            <h3 className="text-xl font-black text-gray-800">
              {activePerson?.emoji} {activePerson?.name}'s Must-Do Rides
              <span className="ml-2 text-sm text-gray-400 font-normal">({countFor(person)} selected)</span>
            </h3>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setParkFilter(null)} className={`text-xs px-3 py-1 rounded-full font-bold ${!parkFilter?'bg-violet-600 text-white':'bg-white border border-gray-200 text-gray-500 hover:border-violet-300'}`}>All Parks</button>
              {PARKS.filter(p => RIDES[p.id]).map(p => <button key={p.id} onClick={() => setParkFilter(p.id)} className={`text-xs px-3 py-1 rounded-full font-bold ${parkFilter===p.id?'bg-violet-600 text-white':'bg-white border border-gray-200 text-gray-500 hover:border-violet-300'}`}>{p.emoji} {p.name}</button>)}
            </div>
            {Object.entries(RIDES).filter(([pid]) => !parkFilter || pid === parkFilter).map(([parkId, parkData]) => {
              const areas = getAreas(parkId);
              return (
                <div key={parkId} className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                  <h4 className="font-black text-lg mb-3" style={{ color: parkData.color }}>{parkData.emoji} {parkData.name}</h4>
                  {Object.entries(areas).map(([area, rides]) => (
                    <div key={area} className="mb-3">
                      <div className="text-xs font-black text-gray-400 uppercase tracking-wider mb-1.5 pl-1">{area}</div>
                      <div className="grid sm:grid-cols-2 gap-1">
                        {rides.map(ride => {
                          const key = `${parkId}::${ride.name}`;
                          const checked = wishlist[person]?.[key] || false;
                          return (
                            <label key={key} className={`flex items-center gap-2 px-3 py-2 rounded-xl cursor-pointer transition-all ${checked?'bg-violet-50 border border-violet-200':'hover:bg-gray-50 border border-transparent'}`}>
                              <input type="checkbox" checked={checked} onChange={() => toggle(person, key)} className="w-4 h-4 accent-violet-600 rounded flex-shrink-0" />
                              <span className={`text-sm flex-1 ${checked?'font-black text-violet-700':'text-gray-600 font-semibold'}`}>{ride.name}</span>
                              {ride.height && (
                                <span className={`text-xs px-1.5 py-0.5 rounded font-bold flex-shrink-0 ${ride.height >= 44 ? 'bg-red-100 text-red-700' : ride.height >= 40 ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                  {ride.height}"
                                </span>
                              )}
                              {checked && <span className="text-violet-400 text-xs font-bold flex-shrink-0">⭐</span>}
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {view === 'ride' && (
        <div className="space-y-4">
          <div className="bg-violet-50 border border-violet-200 rounded-2xl p-3 text-violet-700 text-sm font-bold">
            🎢 Group Ride Popularity — sorted by most wanted. Height requirements shown in color: 🔴 48"+ 🟠 40–44" 🟡 32–38"
          </div>
          {Object.entries(RIDES).map(([parkId, parkData]) => (
            <div key={parkId} className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
              <h4 className="font-black text-lg mb-4" style={{ color: parkData.color }}>{parkData.emoji} {parkData.name}</h4>
              <div className="space-y-2">
                {[...parkData.rides].sort((a,b) => wanters(parkId,b.name).length - wanters(parkId,a.name).length).map(ride => {
                  const names = wanters(parkId, ride.name);
                  const pct = names.length / ATTENDEES.length;
                  return (
                    <div key={ride.name}>
                      <div className="flex items-center gap-2 mb-0.5">
                        <span className="text-sm font-bold text-gray-700 flex-1">{ride.name}</span>
                        {ride.height && <span className={`text-xs px-1.5 py-0.5 rounded font-bold ${ride.height>=44?'bg-red-100 text-red-700':ride.height>=40?'bg-orange-100 text-orange-700':'bg-yellow-100 text-yellow-700'}`}>{ride.height}"</span>}
                        <span className="text-xs font-black text-violet-600 w-12 text-right">{names.length}/{ATTENDEES.length}</span>
                      </div>
                      <div className="w-full bg-gray-100 rounded-full h-2">
                        <div className="progress-bar h-2 rounded-full" style={{ width:`${pct*100}%`, background: pct>0.6?'#7c3aed':pct>0.3?'#a78bfa':'#ddd6fe' }} />
                      </div>
                      {names.length > 0 && <div className="text-xs text-gray-400 mt-0.5">{names.join(', ')}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}

      {view === 'height' && (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
            <div className="text-sm text-gray-500 leading-relaxed">
              Rides grouped by minimum height requirement. Check this before planning the day — especially for little ones in the group.
            </div>
            <div className="flex flex-wrap gap-2 mt-3">
              {[['No Requirement','#15803d'],['35" or less','#92400e'],['36–40"','#9a3412'],['41"+','#b91c1c']].map(([l,c])=>(
                <div key={l} className="text-xs font-bold px-3 py-1 rounded-full border" style={{ color: c, borderColor: c + '50', background: c + '10' }}>{l}</div>
              ))}
            </div>
          </div>
          {heightGuide().map(([key, rides]) => {
            const col = heightColor(key);
            return (
              <div key={key} className="bg-white rounded-2xl shadow-sm overflow-hidden" style={{ border: `1.5px solid ${col.border}` }}>
                <div className="px-5 py-3 flex items-center gap-3" style={{ background: col.bg, borderBottom: `1px solid ${col.border}` }}>
                  <span className="font-black text-lg" style={{ color: col.text }}>
                    {key === 'No Requirement' ? '✅ No Height Requirement' : `📏 ${key} minimum`}
                  </span>
                  <span className="ml-auto text-xs font-bold px-2.5 py-0.5 rounded-full" style={{ background: col.badge, color: col.text }}>{rides.length} ride{rides.length!==1?'s':''}</span>
                </div>
                <div className="divide-y divide-gray-50">
                  {rides.map((r,i) => {
                    const park = PARKS.find(p => p.id === r.parkId);
                    return (
                      <div key={i} className="px-5 py-2.5 flex items-center gap-3">
                        <div className="flex-1">
                          <span className="font-semibold text-gray-800 text-sm">{r.name}</span>
                          {r.area && <span className="text-xs text-gray-400 ml-2">· {r.area}</span>}
                        </div>
                        {park && (
                          <span className="text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0"
                            style={{ backgroundColor: park.bg, color: park.color, border: `1px solid ${park.border}` }}>
                            {park.emoji} {park.name}
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

// ─── LIGHTNING LANE TAB ───────────────────────────────────────────
const LightningLaneTab = ({ ll, setLL }) => {
  const [activeFamily, setActiveFamily] = useState(FAMILY_GROUPS[0].key);

  const addEntry = (fKey) => setLL(prev => ({
    ...prev,
    [fKey]: [...(prev[fKey] || []), { id: Date.now(), park: 'mk', ride: '', desiredTime: '', actualTime: '' }]
  }));

  const updateEntry = (fKey, id, field, val) => setLL(prev => ({
    ...prev,
    [fKey]: prev[fKey].map(e => e.id === id ? { ...e, [field]: val } : e)
  }));

  const updatePark = (fKey, id, park) => setLL(prev => ({
    ...prev,
    [fKey]: prev[fKey].map(e => e.id === id ? { ...e, park, ride: '' } : e)
  }));

  const removeEntry = (fKey, id) => setLL(prev => ({
    ...prev,
    [fKey]: prev[fKey].filter(e => e.id !== id)
  }));

  const family = FAMILY_GROUPS.find(g => g.key === activeFamily);
  const entries = ll[activeFamily] || [];
  const bookedCount = entries.filter(e => e.actualTime).length;

  return (
    <div className="space-y-4 fade-in">

      {/* Info banner */}
      <div style={{ background:'#0a1f5c', borderRadius:'16px', padding:'16px 20px' }}>
        <p style={{ color:'#e8c76a', fontWeight:800, fontSize:'14px', margin:0 }}>⚡ Lightning Lane Planner</p>
        <p style={{ color:'rgba(255,255,255,0.6)', fontSize:'12px', marginTop:'4px', marginBottom:0 }}>Select a family, add rides with your desired time window, then fill in the Actual column once reservations are secured.</p>
      </div>

      {/* Family selector */}
      <div className="flex flex-wrap gap-2">
        {FAMILY_GROUPS.map(g => {
          const count = (ll[g.key] || []).length;
          const booked = (ll[g.key] || []).filter(e => e.actualTime).length;
          const sel = activeFamily === g.key;
          return (
            <button
              key={g.key}
              onClick={() => setActiveFamily(g.key)}
              className={`px-4 py-2 rounded-full text-sm font-bold transition-all flex items-center gap-2 ${sel ? 'bg-yellow-500 text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200 hover:border-yellow-300'}`}
            >
              {g.label}
              {count > 0 && (
                <span className={`text-xs px-1.5 py-0.5 rounded-full font-black ${sel ? 'bg-white text-yellow-600' : 'bg-yellow-100 text-yellow-700'}`}>
                  {booked}/{count}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {/* Table card */}
      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

        {/* Card header */}
        <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <div className="font-black text-gray-800 text-lg">{family.label}</div>
            <div className="text-xs text-gray-400 mt-0.5">
              {family.sub}
              {entries.length > 0 && <span className="ml-2 text-yellow-600 font-bold">{bookedCount} of {entries.length} booked</span>}
            </div>
          </div>
          <button
            onClick={() => addEntry(activeFamily)}
            className="bg-yellow-500 hover:bg-yellow-400 text-white font-bold px-4 py-2 rounded-xl text-sm transition-all"
          >
            + Add Ride
          </button>
        </div>

        {entries.length === 0 ? (
          <div className="py-16 text-center text-gray-300">
            <div className="text-5xl mb-3">⚡</div>
            <div className="font-bold text-gray-400">No Lightning Lanes planned yet</div>
            <div className="text-sm text-gray-300 mt-1">Click "+ Add Ride" to start planning</div>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-100">
                  <th className="text-left px-5 py-3 text-xs font-black text-gray-400 uppercase tracking-wider">Ride</th>
                  <th className="text-left px-5 py-3 text-xs font-black text-yellow-500 uppercase tracking-wider w-40">Desired Time</th>
                  <th className="text-left px-5 py-3 text-xs font-black text-green-600 uppercase tracking-wider w-40">Actual Time</th>
                  <th className="px-4 py-3 w-8"></th>
                </tr>
              </thead>
              <tbody>
                {entries.map((entry, i) => {
                  const parkObj = PARKS.find(p => p.id === entry.park);
                  const booked = !!entry.actualTime;
                  return (
                    <tr key={entry.id} className={`border-b border-gray-50 transition-colors ${booked ? 'bg-green-50/40' : i % 2 === 1 ? 'bg-gray-50/40' : ''}`}>

                      {/* Ride cell */}
                      <td className="px-5 py-3">
                        <div className="flex flex-col gap-1.5">
                          {/* Park picker */}
                          <select
                            value={entry.park}
                            onChange={e => updatePark(activeFamily, entry.id, e.target.value)}
                            className="border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold w-44"
                            style={{ color: parkObj?.color }}
                          >
                            {PARKS.filter(p => RIDES[p.id]).map(p => (
                              <option key={p.id} value={p.id}>{p.name}</option>
                            ))}
                          </select>
                          {/* Ride picker */}
                          <select
                            value={entry.ride}
                            onChange={e => updateEntry(activeFamily, entry.id, 'ride', e.target.value)}
                            className="border border-gray-200 rounded-lg px-2 py-1 text-xs w-64"
                          >
                            <option value="">Select ride…</option>
                            {RIDES[entry.park]?.rides.map(r => (
                              <option key={r.name} value={r.name}>
                                {r.name}{r.height ? `  (${r.height}" min)` : ''}
                              </option>
                            ))}
                          </select>
                        </div>
                      </td>

                      {/* Desired time */}
                      <td className="px-5 py-3">
                        <input
                          type="text"
                          value={entry.desiredTime}
                          onChange={e => updateEntry(activeFamily, entry.id, 'desiredTime', e.target.value)}
                          placeholder="e.g. 10:00 AM"
                          className="w-full border border-yellow-200 bg-yellow-50 rounded-lg px-3 py-1.5 text-sm placeholder-yellow-300"
                        />
                      </td>

                      {/* Actual time */}
                      <td className="px-5 py-3">
                        <input
                          type="text"
                          value={entry.actualTime}
                          onChange={e => updateEntry(activeFamily, entry.id, 'actualTime', e.target.value)}
                          placeholder="Once booked…"
                          className={`w-full border rounded-lg px-3 py-1.5 text-sm transition-all ${booked ? 'border-green-300 bg-green-50 text-green-800 font-bold' : 'border-gray-200 placeholder-gray-300'}`}
                        />
                        {booked && <div className="text-xs text-green-600 font-bold mt-0.5">Booked</div>}
                      </td>

                      {/* Remove */}
                      <td className="px-4 py-3 text-center">
                        <button onClick={() => removeEntry(activeFamily, entry.id)} className="text-gray-200 hover:text-red-400 text-xl font-bold leading-none transition-colors">×</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* Summary across all families */}
      {FAMILY_GROUPS.some(g => (ll[g.key]||[]).length > 0) && (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <div className="font-black text-gray-700 mb-3">All Families — Summary</div>
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            {FAMILY_GROUPS.map(g => {
              const total  = (ll[g.key] || []).length;
              const booked = (ll[g.key] || []).filter(e => e.actualTime).length;
              return (
                <div key={g.key} className="rounded-xl border border-gray-100 p-3 text-center">
                  <div className="font-black text-gray-700 text-sm">{g.label}</div>
                  <div className="text-2xl font-black mt-1" style={{ color: booked === total && total > 0 ? '#16a34a' : '#f59e0b' }}>
                    {booked}<span className="text-gray-300 font-normal text-lg">/{total}</span>
                  </div>
                  <div className="text-xs text-gray-400 mt-0.5">booked</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

// ─── DINING TAB ───────────────────────────────────────────────────
const DiningTab = ({ reservations, setReservations }) => {
  const blank = { restaurant: '', date: TRIP_DATES[1], time: '', confirmation: '', status: 'pending', partyIds: ATTENDEES.map(a=>a.id), notes: '' };
  const [form, setForm]       = useState(blank);
  const [editId, setEditId]   = useState(null);
  const [showForm, setShowForm] = useState(false);

  const setField = (k, v) => setForm(f => ({...f, [k]: v}));

  const toggleParty = (id) => setForm(f => {
    const ids = f.partyIds.includes(id) ? f.partyIds.filter(i=>i!==id) : [...f.partyIds, id];
    return {...f, partyIds: ids};
  });

  const toggleAll = () => setForm(f => ({
    ...f, partyIds: f.partyIds.length === ATTENDEES.length ? [] : ATTENDEES.map(a=>a.id)
  }));

  const save = () => {
    if (!form.restaurant) return;
    if (editId) {
      setReservations(prev => prev.map(r => r.id === editId ? {...form, id: editId} : r));
      setEditId(null);
    } else {
      setReservations(prev => [...prev, {...form, id: Date.now().toString()}]);
    }
    setForm(blank); setShowForm(false);
  };

  const startEdit = (r) => {
    setForm({...r}); setEditId(r.id); setShowForm(true);
    window.scrollTo({top: 0, behavior: 'smooth'});
  };

  const remove = (id) => setReservations(prev => prev.filter(r => r.id !== id));

  const statusConfig = {
    confirmed: { label: 'Confirmed', color: '#16a34a', bg: '#f0fdf4', border: '#bbf7d0', badge: '#dcfce7' },
    pending:   { label: 'Pending',   color: '#d97706', bg: '#fffbeb', border: '#fde68a', badge: '#fef9c3' },
    waitlist:  { label: 'Waitlist',  color: '#7c3aed', bg: '#f5f3ff', border: '#ddd6fe', badge: '#ede9fe' },
    cancelled: { label: 'Cancelled', color: '#dc2626', bg: '#fef2f2', border: '#fecaca', badge: '#fee2e2' },
  };

  const partyLabel = (partyIds) => {
    if (!partyIds || partyIds.length === 0) return 'Nobody selected';
    if (partyIds.length === ATTENDEES.length) return `Entire Group (${ATTENDEES.length})`;
    if (partyIds.length <= 5) return partyIds.map(id => ATTENDEES.find(a=>a.id===id)?.name).filter(Boolean).join(', ');
    return `${partyIds.length} guests`;
  };

  // Group by date, sorted
  const byDate = {};
  TRIP_DATES.forEach(d => { byDate[d] = []; });
  reservations.forEach(r => { if (byDate[r.date]) byDate[r.date].push(r); });

  const confirmedCount = reservations.filter(r => r.status === 'confirmed').length;

  return (
    <div className="space-y-5 fade-in">
      {/* Header row */}
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div className="font-black text-gray-800 text-xl">Dining Reservations</div>
          <div className="text-xs text-gray-400 mt-0.5">
            {reservations.length} total · <span className="text-green-600 font-bold">{confirmedCount} confirmed</span>
            {reservations.length - confirmedCount > 0 && <span className="text-amber-600 font-bold"> · {reservations.length - confirmedCount} pending/other</span>}
          </div>
        </div>
        <button
          onClick={() => { setForm(blank); setEditId(null); setShowForm(s => !s); }}
          className="font-bold px-5 py-2.5 rounded-xl text-sm transition-all shadow-sm text-white"
          style={{ background: showForm && !editId ? '#6b7280' : '#f59e0b' }}
        >
          {showForm && !editId ? '✕ Cancel' : '+ Add Reservation'}
        </button>
      </div>

      {/* Form */}
      {showForm && (
        <div className="bg-white rounded-2xl shadow-sm border-2 border-amber-200 p-5 fade-in">
          <div className="font-black text-gray-700 mb-4 text-lg">{editId ? 'Edit Reservation' : 'New Reservation'}</div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

            {/* Restaurant */}
            <div className="md:col-span-2">
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Restaurant</label>
              <input list="res-list" value={form.restaurant} onChange={e=>setField('restaurant',e.target.value)}
                placeholder="Type or select from your restaurant list…"
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:border-amber-400 focus:outline-none" />
              <datalist id="res-list">
                {FOOD_OPTIONS.map(f => <option key={f.id} value={f.name}>{f.location} · {f.type}</option>)}
              </datalist>
            </div>

            {/* Date */}
            <div>
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Date</label>
              <select value={form.date} onChange={e=>setField('date',e.target.value)}
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:border-amber-400 focus:outline-none">
                {TRIP_DATES.map(d => <option key={d} value={d}>{DATE_META[d]?.short || d}</option>)}
              </select>
            </div>

            {/* Time */}
            <div>
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Reservation Time</label>
              <input value={form.time} onChange={e=>setField('time',e.target.value)} placeholder="e.g. 6:30 PM"
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:border-amber-400 focus:outline-none" />
            </div>

            {/* Status */}
            <div>
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Status</label>
              <select value={form.status} onChange={e=>setField('status',e.target.value)}
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:border-amber-400 focus:outline-none">
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="waitlist">Waitlist</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            {/* Confirmation # */}
            <div>
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Confirmation #</label>
              <input value={form.confirmation} onChange={e=>setField('confirmation',e.target.value)} placeholder="e.g. 12345678"
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:border-amber-400 focus:outline-none" />
            </div>

            {/* Who's coming */}
            <div className="md:col-span-2">
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Who's Coming</label>
              <button onClick={toggleAll}
                className="mb-2 text-xs font-bold px-3 py-1 rounded-full border transition-all"
                style={ form.partyIds.length === ATTENDEES.length
                  ? { background:'#f59e0b', color:'#fff', borderColor:'#f59e0b' }
                  : { background:'#fffbeb', color:'#92400e', borderColor:'#fde68a' }
                }>
                {form.partyIds.length === ATTENDEES.length ? '✓ Entire Group Selected' : '+ Select Entire Group'}
              </button>
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-1 border border-gray-100 rounded-xl p-3 max-h-40 overflow-y-auto">
                {FAMILY_GROUPS.map(fg => {
                  const members = ATTENDEES.filter(a => a.group === fg.key);
                  return (
                    <React.Fragment key={fg.key}>
                      <div className="col-span-full text-xs font-black text-gray-300 uppercase tracking-widest mt-2 mb-0.5 first:mt-0">{fg.label}</div>
                      {members.map(a => (
                        <label key={a.id} className="flex items-center gap-2 text-sm cursor-pointer py-0.5 hover:text-gray-800 text-gray-600">
                          <input type="checkbox" checked={form.partyIds.includes(a.id)} onChange={() => toggleParty(a.id)} className="accent-amber-500" />
                          <span className="font-medium">{a.name}</span>
                        </label>
                      ))}
                    </React.Fragment>
                  );
                })}
              </div>
              <div className="text-xs text-gray-400 mt-1">{form.partyIds.length} of {ATTENDEES.length} selected</div>
            </div>

            {/* Notes */}
            <div className="md:col-span-2">
              <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Notes</label>
              <input value={form.notes} onChange={e=>setField('notes',e.target.value)}
                placeholder="e.g. Birthday celebration, window table requested, dietary needs…"
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:border-amber-400 focus:outline-none" />
            </div>
          </div>

          <div className="mt-5 flex gap-2">
            <button onClick={save} disabled={!form.restaurant}
              className="font-bold px-6 py-2.5 rounded-xl text-sm transition-all text-white disabled:opacity-40"
              style={{ background: '#f59e0b' }}>
              {editId ? 'Save Changes' : 'Add Reservation'}
            </button>
            <button onClick={() => { setShowForm(false); setEditId(null); setForm(blank); }}
              className="border border-gray-200 text-gray-500 font-bold px-5 py-2.5 rounded-xl text-sm hover:bg-gray-50 transition-all">
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* Empty state */}
      {reservations.length === 0 && !showForm && (
        <div className="py-24 text-center">
          <div className="text-6xl mb-4">🍽️</div>
          <div className="font-black text-gray-400 text-lg">No reservations yet</div>
          <div className="text-sm text-gray-300 mt-1">Click "+ Add Reservation" to start tracking your dining</div>
          <div className="text-xs text-gray-300 mt-3">Tip: Disney dining reservations open 60 days in advance — book early!</div>
        </div>
      )}

      {/* Reservations by date */}
      {reservations.length > 0 && (
        <div className="space-y-4">
          {TRIP_DATES.map(date => {
            const dayRes = (byDate[date] || []).sort((a,b) => (a.time||'').localeCompare(b.time||''));
            if (dayRes.length === 0) return null;
            const meta = DATE_META[date];
            return (
              <div key={date} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="px-5 py-3 flex items-center gap-3 border-b border-gray-100" style={{ background: '#f8fafc' }}>
                  <div className="font-black text-gray-800">{meta?.short}</div>
                  {meta?.tag && <span className="text-xs text-gray-400">{meta.tag}</span>}
                  <span className="ml-auto text-xs font-bold text-amber-600 bg-amber-50 border border-amber-100 px-2.5 py-0.5 rounded-full">
                    {dayRes.length} reservation{dayRes.length !== 1 ? 's' : ''}
                  </span>
                </div>
                <div className="divide-y divide-gray-50">
                  {dayRes.map(r => {
                    const sc = statusConfig[r.status] || statusConfig.pending;
                    return (
                      <div key={r.id} className="px-5 py-3.5 flex items-start gap-4" style={{ background: sc.bg }}>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-black text-gray-800">{r.restaurant}</span>
                            {r.time && <span className="text-sm font-bold text-gray-500">· {r.time}</span>}
                            <span className="text-xs font-bold px-2.5 py-0.5 rounded-full" style={{ background: sc.badge, color: sc.color, border: `1px solid ${sc.border}` }}>
                              {sc.label}
                            </span>
                          </div>
                          <div className="text-xs text-gray-500 mt-1 font-medium">
                            👥 {partyLabel(r.partyIds)}
                          </div>
                          {(r.confirmation || r.notes) && (
                            <div className="text-xs text-gray-400 mt-1 flex gap-3 flex-wrap">
                              {r.confirmation && <span>Confirmation: <span className="font-bold text-gray-600 font-mono">#{r.confirmation}</span></span>}
                              {r.notes && <span className="italic">{r.notes}</span>}
                            </div>
                          )}
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0 mt-0.5">
                          <button onClick={() => startEdit(r)} className="text-xs font-bold px-2.5 py-1 rounded-lg transition-all text-gray-400 hover:text-amber-600 hover:bg-amber-50">Edit</button>
                          <button onClick={() => remove(r.id)} className="text-gray-200 hover:text-red-400 text-xl font-bold leading-none transition-colors">×</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

// ─── SUPABASE ─────────────────────────────────────────────────────
const SUPABASE_URL = 'https://qdqesiovkrhgtczrztzk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_E8vvqtv6K9pE8Hf6fSIRyw__4ywIS6L';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── APP ──────────────────────────────────────────────────────────
const App = () => {
  const [ready,        setReady]        = useState(false);
  const [syncStatus,   setSyncStatus]   = useState('loading'); // 'loading' | 'live' | 'error'
  const [tab,          setTab]          = useState('logistics');
  const [ticketId,     setTicketId]     = useState('4-hopper');
  const [parkAssign,   setParkAssign]   = useState({});
  const [meals,        setMeals]        = useState(initMeals());
  const [logistics,    setLogistics]    = useState(initLogistics());
  const [wishlist,     setWishlist]     = useState(initWishlist());
  const [ll,           setLL]           = useState(initLL());
  const [reservations, setReservations] = useState([]);
  const [adultCount,   setAdultCount]   = useState(12);
  const [childCount,   setChildCount]   = useState(5);

  // ── Load all state from Supabase on mount ────────────────────────
  useEffect(() => {
    db.from('disney_trip').select('*').then(({ data, error }) => {
      if (error) { console.error('Supabase load error:', error); setSyncStatus('error'); setReady(true); return; }
      if (data && data.length > 0) {
        const m = {};
        data.forEach(row => { m[row.key] = row.value; });
        if (m.ticket      !== undefined) setTicketId(m.ticket);
        if (m.parks       !== undefined) setParkAssign(Object.keys(m.parks    || {}).length ? m.parks     : {});
        if (m.meals       !== undefined) setMeals(      Object.keys(m.meals    || {}).length ? m.meals     : initMeals());
        if (m.logistics   !== undefined) setLogistics(  Object.keys(m.logistics|| {}).length ? m.logistics : initLogistics());
        if (m.wishlist    !== undefined) setWishlist(   Object.keys(m.wishlist || {}).length ? m.wishlist  : initWishlist());
        if (m.ll          !== undefined) setLL(         Object.keys(m.ll       || {}).length ? m.ll        : initLL());
        if (m.reservations!== undefined) setReservations(Array.isArray(m.reservations) ? m.reservations : []);
        if (m.adultCount  !== undefined) setAdultCount(m.adultCount);
        if (m.childCount  !== undefined) setChildCount(m.childCount);
      }
      setSyncStatus('live');
      setReady(true);
    });

    // ── Real-time: reflect changes made on other devices instantly ──
    const channel = db.channel('trip-sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'disney_trip' }, ({ new: row }) => {
        if (!row) return;
        if (row.key === 'ticket')        setTicketId(row.value);
        if (row.key === 'parks')         setParkAssign(row.value);
        if (row.key === 'meals')         setMeals(row.value);
        if (row.key === 'logistics')     setLogistics(row.value);
        if (row.key === 'wishlist')      setWishlist(row.value);
        if (row.key === 'll')            setLL(row.value);
        if (row.key === 'reservations')  setReservations(row.value);
        if (row.key === 'adultCount')    setAdultCount(row.value);
        if (row.key === 'childCount')    setChildCount(row.value);
      })
      .subscribe();

    return () => db.removeChannel(channel);
  }, []);

  // ── Save a single key to Supabase ───────────────────────────────
  const save = (key, value) => {
    db.from('disney_trip')
      .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' })
      .then(({ error }) => { if (error) console.error('Save error:', key, error); });
  };

  useEffect(() => { if (ready) save('ticket',       ticketId);     }, [ticketId]);
  useEffect(() => { if (ready) save('parks',        parkAssign);   }, [parkAssign]);
  useEffect(() => { if (ready) save('meals',        meals);        }, [meals]);
  useEffect(() => { if (ready) save('logistics',    logistics);    }, [logistics]);
  useEffect(() => { if (ready) save('wishlist',     wishlist);     }, [wishlist]);
  useEffect(() => { if (ready) save('ll',           ll);           }, [ll]);
  useEffect(() => { if (ready) save('reservations', reservations); }, [reservations]);
  useEffect(() => { if (ready) save('adultCount',   adultCount);   }, [adultCount]);
  useEffect(() => { if (ready) save('childCount',   childCount);   }, [childCount]);

  const ticket = TICKET_OPTIONS.find(t => t.id === ticketId);

  // ── Loading screen ───────────────────────────────────────────────
  if (!ready) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', flexDirection:'column', gap:16, background:'#06122e' }}>
      <div style={{ fontSize:56 }}>🏰</div>
      <div style={{ fontFamily:'Cinzel,serif', fontSize:22, color:'#e8c76a', fontWeight:800, letterSpacing:'0.04em' }}>Loading your trip…</div>
      <div style={{ fontSize:13, color:'rgba(255,255,255,0.4)', marginTop:4 }}>Connecting to Supabase</div>
    </div>
  );

  return (
    <div className="min-h-screen" style={{ background: '#f4f5f7' }}>
      <Header />
      <TabNav active={tab} setActive={setTab} />
      {/* Live sync status bar */}
      <div style={{ background: syncStatus === 'live' ? '#15803d' : syncStatus === 'error' ? '#dc2626' : '#d97706', padding:'5px 16px', textAlign:'center' }}>
        <span style={{ fontSize:11, fontWeight:700, color:'#fff', letterSpacing:'0.06em' }}>
          {syncStatus === 'live'  && '● LIVE — changes sync instantly across all families'}
          {syncStatus === 'error' && '● OFFLINE — could not reach Supabase, changes won\'t be shared'}
          {syncStatus === 'loading' && '● Connecting…'}
        </span>
      </div>
      <div className="max-w-6xl mx-auto px-4 py-7">
        {tab === 'logistics' && <LogisticsTab logistics={logistics} setLogistics={setLogistics} />}
        {tab === 'calendar'  && <CalendarTab ticket={ticket} setTicketId={setTicketId} parkAssign={parkAssign} setParkAssign={setParkAssign} meals={meals} setMeals={setMeals} reservations={reservations} adultCount={adultCount} setAdultCount={setAdultCount} childCount={childCount} setChildCount={setChildCount} />}
        {tab === 'dining'    && <DiningTab reservations={reservations} setReservations={setReservations} />}
        {tab === 'wishlist'  && <WishlistTab wishlist={wishlist} setWishlist={setWishlist} />}
        {tab === 'll'        && <LightningLaneTab ll={ll} setLL={setLL} />}
      </div>
      <div className="text-center py-8 text-gray-300 text-xs">🏰 Shea Family Disney World 2026 · Powered by Supabase</div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
